# ============================================================================
# 智能家居边缘智能系统 - 前端生产部署 Nginx 配置（静态导出 out/ + 反向代理）
#
# 工作方式：
#   1) 浏览器访问 Nginx(80)，由 Nginx 直接返回 Next.js 静态导出的 out/ 页面；
#   2) /api、/uploads 请求反向代理到 SpringBoot 业务服务(8080)；
#   3) /api/device/stream 是 SSE 长连接，需关闭缓冲、拉长读超时，否则实时数据会被攒批。
#
# 部署前通常只需改两处：
#   - root：指向你构建产物 web/out 的【绝对路径】（见下方 server 块，用正斜杠）
#   - proxy_pass 的 127.0.0.1:8080：若后端在别的机器，改成对应地址
#
#   Windows 本机示例：root "D:/My project/Smart Home/web/out";
#   Linux 服务器示例：root /opt/smart-home/web/out;
# ============================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # gzip 压缩：JS/CSS（含 echarts 图表库）体积较大，压缩后传输量约降 2/3
    gzip            on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml text/xml image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        # Next.js 静态导出产物目录（部署时改成你的实际绝对路径，用正斜杠）
        root   "D:/My project/Smart Home/web/out";
        index  index.html;

        # 带内容 hash 的构建静态资源，可长期强缓存
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SSE 遥测：必须关闭代理缓冲，否则设备数据会被 Nginx 攒批、前端看不到实时刷新
        location ^~ /api/device/stream {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 86400s;
            chunked_transfer_encoding on;
        }

        # 业务接口（检测、设备、记录等）反向代理到 SpringBoot
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # 上传的检测图片
        location /uploads/ {
            proxy_pass       http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        # 前端路由：静态导出为扁平 .html（访问 /device 回退到 /device.html）
        location / {
            try_files $uri $uri.html $uri/ /index.html;
        }

        error_page 404 /404.html;
    }
}
