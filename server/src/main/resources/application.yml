server:
  port: 8080

spring:
  application:
    name: smart-home-server
  mvc:
    async:
      request-timeout: -1   # SSE 长连接不超时（默认 30s 会断开 EventSource）
  profiles:
    active: local          # 数据库密码在 application-local.yml（已 gitignore，不提交）
  servlet:
    multipart:
      max-file-size: 10MB   # 单张图片上限
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/smarthome?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # password 见 application-local.yml

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 下划线列名自动映射驼峰字段
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 开发期控制台打印 SQL
  global-config:
    db-config:
      id-type: auto

# 在线接口文档（springdoc），访问 /swagger-ui.html 或 /docs.html
springdoc:
  swagger-ui:
    path: /docs.html

# Python AI 推理服务地址（换部署环境只改这里）
ai:
  service:
    url: http://127.0.0.1:8000

# 本项目自定义配置
app:
  upload-dir: ./uploads   # 检测图片本地存储目录（已 gitignore）

# 设备线（阶段6a）：内置 Mock 设备模拟温湿度/光照/风扇，SSE 每 2s 推送
device:
  gateway:
    type: mock            # mock=内置模拟设备；tcp=预留真实 STM32/Modbus 网关（暂未实现，切换不改业务/前端）
  mock:
    tick-ms: 2000         # Mock 物理模型推进周期（毫秒）
  push:
    interval-ms: 2000     # SSE 遥测推送周期（毫秒）
